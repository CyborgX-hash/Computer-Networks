# =============================================================================
# dnsmasq — Private DNS Configuration for the Private Network Service Platform
# =============================================================================
#
# Machine:      Mac 1 (MAC1_IP)
# Purpose:      Resolve project .test domains to the nginx edge proxy (Mac 2).
#               All other DNS queries are forwarded to an upstream public
#               resolver so that normal internet access is unaffected.
#
# IMPORTANT — PLACEHOLDER:
#   Replace every occurrence of MAC2_IP below with the actual LAN IPv4 address
#   of Mac 2 (the nginx / edge proxy machine).
#
#   To find Mac 2's IP, run on Mac 2:
#       ipconfig getifaddr en0      (Wi-Fi)
#       ipconfig getifaddr en7      (USB Ethernet)
#
# Installation (macOS with Homebrew):
#   brew install dnsmasq
#
# Usage:
#   sudo dnsmasq -C /path/to/this/dnsmasq.conf -d
#   (-d keeps dnsmasq in the foreground for easy debugging; omit for daemon mode)
#
# =============================================================================

# ---------------------------------------------------------------------------
# 1. Listening Configuration
# ---------------------------------------------------------------------------

# Listen on all interfaces so that other machines on the LAN can use this
# DNS server. Mac 2 and Mac 3 should set their DNS to MAC1_IP.
listen-address=0.0.0.0

# Standard DNS port. Requires sudo on macOS to bind to port 53.
port=53

# Do not use /etc/hosts entries (keeps resolution predictable for the project)
no-hosts

# Do not read /etc/resolv.conf; we specify upstream servers explicitly below
no-resolv

# ---------------------------------------------------------------------------
# 2. Project Domain Records (.test TLD)
# ---------------------------------------------------------------------------
# Both domains point to Mac 2 (nginx edge proxy), NOT to the backend (Mac 3).
# This ensures all client traffic passes through nginx for TLS termination
# and load balancing.
#
# ┌──────────────────────┐      ┌──────────────────────┐
# │  app.teamX.test  ────┼─────>│  MAC2_IP  (nginx)    │
# │  api.teamX.test  ────┼─────>│  MAC2_IP  (nginx)    │
# └──────────────────────┘      └──────────────────────┘

# >>> REPLACE MAC2_IP WITH THE ACTUAL LAN IP OF MAC 2 <<<
address=/app.teamX.test/MAC2_IP
address=/api.teamX.test/MAC2_IP

# ---------------------------------------------------------------------------
# 3. Upstream DNS Forwarding
# ---------------------------------------------------------------------------
# All queries outside the .test zone are forwarded to public resolvers so
# that normal internet browsing continues to work on the LAN.

server=8.8.8.8
server=8.8.4.4

# ---------------------------------------------------------------------------
# 4. Logging (optional, useful during development)
# ---------------------------------------------------------------------------
# Log every DNS query to stdout / syslog for debugging and viva evidence.
log-queries

# ---------------------------------------------------------------------------
# 5. Cache Configuration
# ---------------------------------------------------------------------------
# Local cache size (entries). dnsmasq caches upstream responses; 1000 is
# more than sufficient for the project.
cache-size=1000
