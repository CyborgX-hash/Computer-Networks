# =============================================================================
# dnsmasq — Dedicated Backup DNS Configuration for Mac 2 (Priyanshu)
# =============================================================================
# Machine:  Mac 2 (10.200.251.227)
# Role:     Backup DNS Resolver
# Target:   Resolves project .test domains to Primary Edge (10.200.251.227)
# TTL:      30 seconds (Enforces Phase 2 TTL Requirement B)
# =============================================================================

port=53
domain=test
local=/teamX.test/

listen-address=127.0.0.1,10.200.251.227
bind-interfaces

# Project domain records (.test TLD) pointing to Primary Edge
address=/app.teamX.test/10.200.251.227
address=/api.teamX.test/10.200.251.227

# Temporary test record for TTL caching experiment (Requirement B)
address=/ttl-test.teamX.test/192.0.2.20

# Phase 2 requirement: local DNS TTL set to 30 seconds
local-ttl=30

# Do not read /etc/hosts or /etc/resolv.conf
no-hosts
no-resolv

# Public upstream forwarders for non-project domains
server=8.8.8.8
server=1.1.1.1

# Logging and cache size
log-queries
cache-size=1000
