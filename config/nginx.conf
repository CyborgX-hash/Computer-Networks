  # =============================================================================
# nginx — Reverse Proxy, Load Balancer & TLS Termination
# Private Network Service Platform
# =============================================================================
#
# Machine:      Mac 2 (MAC2_IP)
# Purpose:      Single edge entry point for all client traffic.
#               - Terminates TLS (HTTPS) on port 8443
#               - Reverse-proxies requests to Backend A & B on Mac 3
#               - Round-robin load balances across both backends
#               - Preserves backend response headers (X-Backend, Cache-Control)
#
# PLACEHOLDERS — Replace before running:
#   MAC3_IP  →  Actual LAN IPv4 address of Mac 3 (backend host)
#               Find it by running on Mac 3:
#                   ipconfig getifaddr en0
#
# Installation (macOS with Homebrew):
#   brew install nginx
#
# Configuration path (Homebrew default on macOS):
#   /opt/homebrew/etc/nginx/nginx.conf          (Apple Silicon)
#   /usr/local/etc/nginx/nginx.conf             (Intel)
#
# Copy this file to the appropriate path, then:
#   nginx -t          # validate syntax
#   nginx             # start
#   nginx -s reload   # reload after changes
#
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Global Settings
# ─────────────────────────────────────────────────────────────────────────────

# Run as a single worker for the development project (sufficient for demo).
worker_processes 1;

events {
    # Maximum simultaneous connections per worker.
    worker_connections 128;
}

http {
    # Include MIME type definitions shipped with nginx.
    include       mime.types;
    default_type  application/octet-stream;

    # Enable efficient file serving.
    sendfile on;

    # Keep-alive timeout for client connections (seconds).
    keepalive_timeout 65;

    # ─────────────────────────────────────────────────────────────────────────
    # Upstream — Round-Robin Load Balancing
    # ─────────────────────────────────────────────────────────────────────────
    #
    # nginx uses round-robin by default when no algorithm directive is specified.
    #
    # Request 1 → Backend A (MAC3_IP:3001)
    # Request 2 → Backend B (MAC3_IP:3002)
    # Request 3 → Backend A …
    #
    # >>> REPLACE MAC3_IP WITH THE ACTUAL LAN IP OF MAC 3 <<<

    upstream backend_servers {
        server 10.7.19.140:3001;   # Backend A
        server 10.7.19.140:3002;   # Backend B
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server — HTTPS (TLS Termination) on port 8443
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Port 8443 is used instead of 443 because binding to ports below 1024
    # requires root privileges on macOS. Using 8443 allows running nginx
    # without sudo during development.
    #
    # If running as root / with sudo, change "listen 8443" to "listen 443".

    server {
        listen       8443 ssl;
        server_name  app.teamX.test;

        # ── TLS Certificate & Key ──────────────────────────────────────────
        #
        # These files are generated locally using mkcert (see tls-setup.md).
        # Do NOT commit these files to Git.
        #
        # Paths assume Homebrew nginx prefix on Apple Silicon macOS.
        # Adjust if your nginx prefix differs.

        ssl_certificate      /opt/homebrew/etc/nginx/certs/app.teamX.test.pem;
        ssl_certificate_key  /opt/homebrew/etc/nginx/certs/app.teamX.test-key.pem;

        # ── TLS Protocol & Cipher Settings ─────────────────────────────────
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Reverse Proxy — All Requests ───────────────────────────────────
        #
        # Every request to https://app.teamX.test:8443/* is forwarded to the
        # upstream backend_servers group via plain HTTP.
        #
        # The proxy_pass target matches the upstream block name above.
        # nginx handles load balancing automatically (round-robin).

        location / {
            proxy_pass http://backend_servers;

            # ── Forwarding Headers ─────────────────────────────────────────
            # These headers let the backend know the original client details.

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── Preserve Backend Response Headers ──────────────────────────
            #
            # By default nginx passes through upstream response headers
            # (X-Backend, Cache-Control, ETag, etc.) without modification.
            #
            # We do NOT add proxy_hide_header or proxy_ignore_headers for
            # X-Backend or Cache-Control, so the client sees the original
            # backend headers intact.
            #
            # Expected client-visible headers from backend:
            #   X-Backend: A        (or B)
            #   Cache-Control: public, max-age=60
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server — HTTP → HTTPS Redirect (optional convenience)
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Redirects plain HTTP requests on port 8080 to the HTTPS endpoint.
    # This is optional for the demo but demonstrates proper HTTP→HTTPS
    # redirection behavior.

    server {
        listen       8080;
        server_name  app.teamX.test;

        return 301 https://$host:8443$request_uri;
    }
}
