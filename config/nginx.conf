# =============================================================================
# nginx — Reverse Proxy, Load Balancer & TLS Termination
# Private Network Service Platform — Phase 2 Primary Edge
# =============================================================================
#
# Machine:      Mac 2 (10.200.251.227)
# Role:         Primary Edge Proxy
# Purpose:      Single edge entry point for all client traffic.
#               - Terminates TLS (HTTPS) on port 8443 for app.teamX.test & api.teamX.test
#               - Reverse-proxies requests to Backend A & B on Mac 3 (10.200.251.76)
#               - Round-robin load balances across both backends
#               - Native passive health checks (max_fails=1, fail_timeout=10s)
#               - Automatic upstream failover via proxy_next_upstream
#               - Preserves backend response headers (X-Backend, Cache-Control)
#
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Global Settings
# ─────────────────────────────────────────────────────────────────────────────

# Run as a single worker for the development project (sufficient for demo).
worker_processes 1;

# Process ID file in user-writable Homebrew runtime directory
pid /opt/homebrew/var/run/nginx_edge.pid;

events {
    # Maximum simultaneous connections per worker.
    worker_connections 128;
}

http {
    # Include MIME type definitions shipped with nginx.
    include       mime.types;
    default_type  application/octet-stream;

    # Enable efficient file serving.
    sendfile on;

    # Keep-alive timeout for client connections (seconds).
    keepalive_timeout 65;

    # ─────────────────────────────────────────────────────────────────────────
    # Upstream — Round-Robin Load Balancing with Passive Health Checks
    # ─────────────────────────────────────────────────────────────────────────
    #
    # nginx uses round-robin load balancing across both backends.
    # Open-source passive health monitoring:
    # - max_fails=1: mark backend inactive after 1 failed attempt
    # - fail_timeout=10s: keep backend out of rotation for 10 seconds before retrying
    #
    # Backend nodes hosted on Mac 3 (Saksham):
    # - Backend A: 10.200.251.76:3001
    # - Backend B: 10.200.251.76:3002

    upstream backend_servers {
        server 10.200.251.76:3001 max_fails=1 fail_timeout=10s;
        server 10.200.251.76:3002 max_fails=1 fail_timeout=10s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server — HTTPS (TLS Termination) on port 8443
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Serves both app.teamX.test and api.teamX.test with dual-SAN local TLS cert.

    server {
        listen       8443 ssl;
        server_name  app.teamX.test api.teamX.test;

        # ── TLS Certificate & Key ──────────────────────────────────────────
        # Dual-SAN development certificate generated via mkcert
        ssl_certificate      /opt/homebrew/etc/nginx/certs/app-and-api.teamX.test.pem;
        ssl_certificate_key  /opt/homebrew/etc/nginx/certs/app-and-api.teamX.test-key.pem;

        # ── TLS Protocol & Cipher Settings ─────────────────────────────────
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Upstream Connection & Failover Settings ────────────────────────
        # Open-source health check failover behavior:
        # If an upstream backend connection errors out, times out, or returns
        # a 5xx response, immediately retry the next upstream backend without
        # returning an error to the client.
        proxy_connect_timeout     2s;
        proxy_read_timeout        5s;
        proxy_next_upstream       error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # ── Forwarding Headers ─────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Reverse Proxy — Root Application Location ──────────────────────
        location / {
            proxy_pass http://backend_servers;
        }

        # ── Reverse Proxy — API Location ───────────────────────────────────
        location /api/ {
            proxy_pass http://backend_servers;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server — HTTP → HTTPS Redirect
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Redirects plain HTTP requests on port 8080 to the HTTPS endpoint on 8443.

    server {
        listen       8080;
        server_name  app.teamX.test api.teamX.test;

        return 301 https://$host:8443$request_uri;
    }
}
