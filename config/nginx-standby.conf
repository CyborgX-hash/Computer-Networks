# =============================================================================
# nginx — Standby Edge Reverse Proxy, Load Balancer & TLS Ingress
# Private Network Service Platform — Phase 2 Standby Edge (Mac 1)
# =============================================================================
#
# Machine:      Mac 1 (10.200.251.106)
# Role:         Standby Edge Proxy (High Availability Failover)
# Purpose:      Serves as hot/warm standby ingress when Primary Edge (Mac 2)
#               is stopped or undergoing maintenance.
#               - Terminates TLS (HTTPS) on port 8443 for app.teamX.test & api.teamX.test
#               - Reverse-proxies requests to Backend A & B on Mac 3 (10.200.251.76)
#               - Round-robin load balances across both backends
#               - Native passive health checks (max_fails=1, fail_timeout=10s)
#               - Automatic upstream failover via proxy_next_upstream
#               - Preserves backend response headers (X-Backend, Cache-Control)
#
# Architecture Alignment:
#   Identical upstream topology, failure detection, timeouts, and header
#   preservation as the Primary Edge (Mac 2 - 10.200.251.227).
#
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Global Settings
# ─────────────────────────────────────────────────────────────────────────────

# Single worker process (sufficient for development/lab demonstration).
worker_processes 1;

# Process ID file in user-writable Homebrew runtime directory
pid /opt/homebrew/var/run/nginx_standby_edge.pid;

events {
    # Maximum simultaneous connections per worker.
    worker_connections 128;
}

http {
    # Include standard MIME type definitions shipped with nginx.
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable efficient kernel sendfile.
    sendfile on;

    # Keep-alive timeout for downstream client connections (seconds).
    keepalive_timeout 65;

    # ─────────────────────────────────────────────────────────────────────────
    # Upstream — Round-Robin Load Balancing with Passive Health Checks
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Matches Mac 2 Primary Edge architecture:
    # - Round-robin distribution
    # - max_fails=1: mark node temporarily inactive upon 1 connection/HTTP failure
    # - fail_timeout=10s: suspend node from rotation for 10s before retrying
    #
    # Upstream targets hosted on Mac 3 (Saksham - 10.200.251.76):
    # - Backend A: 10.200.251.76:3001
    # - Backend B: 10.200.251.76:3002

    upstream backend_servers {
        server 10.200.251.76:3001 max_fails=1 fail_timeout=10s;
        server 10.200.251.76:3002 max_fails=1 fail_timeout=10s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server — HTTPS (TLS Termination) on Port 8443
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Serves both app.teamX.test and api.teamX.test with dual-SAN certificate.

    server {
        listen       8443 ssl;
        server_name  app.teamX.test api.teamX.test;

        # ── TLS Certificate & Key ──────────────────────────────────────────
        # Uses the shared project certificate matching Mac 2's primary ingress
        ssl_certificate      /opt/homebrew/etc/nginx/certs/app-and-api.teamX.test.pem;
        ssl_certificate_key  /opt/homebrew/etc/nginx/certs/app-and-api.teamX.test-key.pem;

        # ── TLS Protocol & Cipher Settings ─────────────────────────────────
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Upstream Connection & Failover Settings ────────────────────────
        # Passive failover: if an upstream server times out, errors out, or returns 5xx,
        # nginx transparently retries the next upstream server before responding to client.
        proxy_connect_timeout     2s;
        proxy_read_timeout        5s;
        proxy_next_upstream       error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # ── Forwarding Headers ─────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Reverse Proxy — Root Application Location ──────────────────────
        location / {
            proxy_pass http://backend_servers;
        }

        # ── Reverse Proxy — API Location ───────────────────────────────────
        location /api/ {
            proxy_pass http://backend_servers;
        }
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Server — HTTP → HTTPS Redirect
    # ─────────────────────────────────────────────────────────────────────────
    #
    # Redirects plain HTTP requests on port 8080 to the HTTPS endpoint on 8443.

    server {
        listen       8080;
        server_name  app.teamX.test api.teamX.test;

        return 301 https://$host:8443$request_uri;
    }
}
